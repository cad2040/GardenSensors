version: "3.8"

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: newrootpassword
      MYSQL_DATABASE: garden_sensors
      MYSQL_USER: garden_sensors
      MYSQL_PASSWORD: garden_sensors
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/create_sensor_readings_view.sql:/docker-entrypoint-initdb.d/02_view.sql:ro
      - ./docker/mysql/03_seed.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pnewrootpassword"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.php
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: garden_sensors
      DB_DATABASE: garden_sensors
      DB_USER: garden_sensors
      DB_PASS: garden_sensors
      APP_URL: http://localhost:8080
      APP_ENV: local
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html/garden-sensors/public
      - ./src:/var/www/html/garden-sensors/src
      - ./python:/var/www/html/garden-sensors/python
      - ./database:/var/www/html/garden-sensors/database
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/login.php"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

  python:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    working_dir: /app
    depends_on:
      - web
      - db
    volumes:
      - ./python:/app/python
      - ./tests/python:/app/tests/python
    environment:
      DB_HOST: db
      DB_NAME: garden_sensors
      DB_USER: garden_sensors
      DB_PASS: garden_sensors
      GUI_BASE_URL: http://web
    profiles:
      - tools

volumes:
  mysql_data:
