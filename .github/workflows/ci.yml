name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: newrootpassword
          MYSQL_DATABASE: garden_sensors
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v2

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.0'
        extensions: mbstring, dom, fileinfo, mysql
        coverage: xdebug

    - name: Setup Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'

    - name: Install PHP dependencies
      run: composer install --prefer-dist --no-progress

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Apply database schema and EC migration
      env:
        MYSQL_PWD: newrootpassword
      run: |
        mysql -h 127.0.0.1 -uroot garden_sensors < database/schema.sql
        mysql -h 127.0.0.1 -uroot garden_sensors < database/migrations/004_ec_nutrient_proxy.sql
        mysql -h 127.0.0.1 -uroot garden_sensors -e "
          SELECT COLUMN_NAME FROM information_schema.COLUMNS
          WHERE TABLE_SCHEMA='garden_sensors' AND TABLE_NAME='plants'
            AND COLUMN_NAME IN ('min_ph','max_ph','ec_underfed','ec_balanced_min','ec_balanced_max','ec_overfed');
        "

    - name: Copy environment file
      run: |
        if [ -f config/environment/.env.example ]; then
          cp config/environment/.env.example config/environment/.env.test
        elif [ -f .env.example ]; then
          cp .env.example .env.test
        fi

    - name: Run PHP tests
      run: vendor/bin/phpunit --testdox --coverage-clover=coverage.xml
      env:
        TESTING: "true"
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: garden_sensors
        DB_NAME: garden_sensors
        DB_USER: root
        DB_PASS: newrootpassword

    - name: Run Python tests
      run: pytest tests/python/ -v --cov=python --cov-report=xml

    - name: Upload coverage reports
      uses: codecov/codecov-action@v2
      with:
        files: ./coverage.xml,./coverage.xml
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.0'
        tools: phpcs

    - name: Install PHP dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run PHP CS
      run: vendor/bin/phpcs --standard=PSR12 src/ tests/

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.0'
        tools: composer

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run security check
      run: composer audit
